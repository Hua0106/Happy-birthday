

<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>偷偷生日快樂 ❤️</title>

<style>

* {

  box-sizing: border-box;

}

:root {

  --gold: #e8c879;

  --gold-light: #fff0c4;

  --gold-dark: #9b7137;

  --red: #b51e35;

}

body {

  margin: 0;

  min-height: 100vh;

  overflow: hidden;

  color: white;

  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;

  background:

    radial-gradient(ellipse at 50% 42%, #29202b 0%, #15111b 48%, #050508 100%);

}

/* 背景星星 */

.stars {

  position: fixed;

  inset: 0;

  overflow: hidden;

  pointer-events: none;

}

.star {

  position: absolute;

  width: 3px;

  height: 3px;

  border-radius: 50%;

  background: var(--gold);

  animation: twinkle 3s infinite ease-in-out;

}

@keyframes twinkle {

  0%, 100% {

    opacity: .2;

    transform: scale(.7);

  }

  50% {

    opacity: 1;

    transform: scale(1.5);

  }

}

/* 主畫面 */

.container {

  position: relative;

  z-index: 1;

  min-height: 100vh;

  width: 100%;

  padding: 25px 18px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

}

.top-label {

  color: var(--gold);

  font-size: 12px;

  letter-spacing: 5px;

  margin-bottom: 15px;

}

h1 {

  margin: 0;

  color: #f3d9b3;

  font-size: clamp(30px, 7vw, 44px);

  font-weight: 500;

  letter-spacing: 4px;

  text-shadow: 0 0 18px rgba(232, 200, 121, .18);

}

.subtitle {

  margin-top: 12px;

  color: #c6a7a3;

  font-size: 14px;

  letter-spacing: 2px;

}

/* 禮物盒 */

.gift-scene {

  position: relative;

  width: 280px;

  height: 300px;

  margin-top: 25px;

  perspective: 1000px;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

}

.gift {

  position: absolute;

  left: 50%;

  bottom: 30px;

  width: 220px;

  height: 190px;

  transform: translateX(-50%);

  transition: opacity .7s ease, transform .7s ease;

}

.gift-box {

  position: absolute;

  bottom: 0;

  width: 220px;

  height: 145px;

  overflow: hidden;

  border: 1px solid rgba(232, 200, 121, .65);

  border-radius: 5px;

  background: linear-gradient(135deg, #242126, #111014 55%, #30242a);

  box-shadow:

    0 18px 40px rgba(0, 0, 0, .55),

    inset 0 0 20px rgba(232, 200, 121, .05);

}

.box-ribbon {

  position: absolute;

  left: 50%;

  width: 34px;

  height: 100%;

  transform: translateX(-50%);

  background: linear-gradient(90deg, #780d20, #c32a42 45%, #8e1428);

}

.box-ribbon-horizontal {

  position: absolute;

  top: 50%;

  width: 100%;

  height: 30px;

  transform: translateY(-50%);

  background: linear-gradient(180deg, #780d20, #c32a42 45%, #8e1428);

}

.gift-lid {

  position: absolute;

  bottom: 135px;

  left: 50%;

  z-index: 3;

  width: 238px;

  height: 55px;

  transform: translateX(-50%);

  transform-origin: 50% 100%;

  border: 1px solid rgba(232, 200, 121, .85);

  border-radius: 5px;

  background: linear-gradient(135deg, #30262b, #171419 55%, #3c2a2f);

  box-shadow: 0 8px 18px rgba(0, 0, 0, .35);

  transition:

    transform 1s cubic-bezier(.2, .8, .2, 1),

    opacity .8s ease;

}

.lid-ribbon {

  position: absolute;

  left: 50%;

  width: 34px;

  height: 100%;

  transform: translateX(-50%);

  background: linear-gradient(90deg, #780d20, #c32a42 45%, #8e1428);

}

.bow {

  position: absolute;

  top: -40px;

  left: 50%;

  width: 90px;

  height: 48px;

  transform: translateX(-50%);

}

.bow::before,

.bow::after {

  content: "";

  position: absolute;

  top: 4px;

  width: 42px;

  height: 32px;

  border: 3px solid #c52b43;

  background: linear-gradient(135deg, #a7192d, #e24a5b, #8e1428);

}

.bow::before {

  left: 0;

  border-radius: 50% 50% 10% 50%;

  transform: rotate(25deg);

}

.bow::after {

  right: 0;

  border-radius: 50% 50% 50% 10%;

  transform: rotate(-25deg);

}

.bow-knot {

  position: absolute;

  top: 15px;

  left: 50%;

  z-index: 2;

  width: 20px;

  height: 20px;

  transform: translateX(-50%);

  border: 2px solid #f0a0a4;

  border-radius: 50%;

  background: #d13a4f;

}

/* 禮物盒開啟 */

.gift.open .gift-lid {

  transform:

    translateX(-50%)

    translateY(-160px)

    rotateX(65deg)

    rotateZ(-12deg);

  opacity: 0;

}

.gift.open {

  opacity: 0;

  transform: translateX(-50%) translateY(35px) scale(.8);

  pointer-events: none;

}

.hint {

  margin-top: 15px;

  color: #c9b8a7;

  font-size: 13px;

  letter-spacing: 2px;

  animation: hintPulse 2s infinite;

}

@keyframes hintPulse {

  0%, 100% { opacity: .45; }

  50% { opacity: 1; }

}

/* 黑金雙層巧克力蛋糕 */

.cake-wrap {

  position: absolute;

  top: 50%;

  left: 50%;

  width: 280px;

  height: 280px;

  transform: translate(-50%, -50%) scale(.45);

  opacity: 0;

  pointer-events: none;

  transition:

    opacity .9s ease,

    transform .9s cubic-bezier(.2, .8, .2, 1);

}

.cake-wrap.show {

  opacity: 1;

  transform: translate(-50%, -50%) scale(1);

}

.cake {

  position: absolute;

  bottom: 25px;

  left: 50%;

  width: 230px;

  height: 220px;

  transform: translateX(-50%);

}

/* 蛋糕底盤 */

.cake-plate {

  position: absolute;

  bottom: 0;

  left: 50%;

  width: 250px;

  height: 18px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: linear-gradient(180deg, #fff0d6, #c8a17f 55%, #80604e);

  box-shadow:

    0 8px 15px rgba(0, 0, 0, .4),

    0 0 12px rgba(232, 200, 121, .15);

}

/* 下層蛋糕 */

.cake-bottom {

  position: absolute;

  bottom: 15px;

  left: 50%;

  width: 210px;

  height: 95px;

  transform: translateX(-50%);

  border: 1px solid #9c7548;

  border-radius: 9px 9px 17px 17px;

  background:

    linear-gradient(

      90deg,

      #211713,

      #4b3024 25%,

      #684632 50%,

      #3b261c 75%,

      #1d130f

    );

  box-shadow:

    inset 0 -12px 15px rgba(0, 0, 0, .35),

    0 8px 18px rgba(0, 0, 0, .2);

}

.cake-bottom-top {

  position: absolute;

  top: -15px;

  left: 50%;

  width: 210px;

  height: 35px;

  transform: translateX(-50%);

  border: 1px solid #b08a54;

  border-radius: 50%;

  background:

    linear-gradient(

      135deg,

      #4d3325,

      #8a6242 45%,

      #392319

    );

}

/* 上層蛋糕 */

.cake-top-tier {

  position: absolute;

  bottom: 105px;

  left: 50%;

  width: 145px;

  height: 70px;

  transform: translateX(-50%);

  border: 1px solid #a17b4c;

  border-radius: 8px 8px 12px 12px;

  background:

    linear-gradient(

      90deg,

      #211510,

      #573726 35%,

      #704b32 55%,

      #3c261a

    );

  box-shadow: inset 0 -8px 10px rgba(0, 0, 0, .2);

}

.cake-top-cap {

  position: absolute;

  top: -13px;

  left: 50%;

  width: 145px;

  height: 27px;

  transform: translateX(-50%);

  border: 1px solid #b08a54;

  border-radius: 50%;

  background:

    linear-gradient(

      135deg,

      #65452e,

      #9b7047 50%,

      #3a2418

    );

}

/* 金色裝飾線 */

.gold-line {

  position: absolute;

  z-index: 4;

  bottom: 40px;

  left: 50%;

  width: 210px;

  height: 4px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:

    linear-gradient(

      90deg,

      #a77c3f,

      #fff0b0,

      #c49a51,

      #fff0b0,

      #a77c3f

    );

  box-shadow: 0 0 8px rgba(232, 200, 121, .3);

}

.upper-gold-line {

  position: absolute;

  z-index: 4;

  bottom: 145px;

  left: 50%;

  width: 145px;

  height: 3px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:

    linear-gradient(

      90deg,

      #a77c3f,

      #fff0b0,

      #c49a51,

      #fff0b0,

      #a77c3f

    );

}

/* 蛋糕正面 1031 */

.cake-number {

  position: absolute;

  z-index: 7;

  bottom: 55px;

  left: 50%;

  width: 100%;

  transform: translateX(-50%);

  color: #e8c879;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 25px;

  font-weight: bold;

  letter-spacing: 5px;

  text-shadow:

    0 1px 1px #5a3b1c,

    0 0 8px rgba(232, 200, 121, .35);

}

/* 金色蠟燭 */

.candle {

  position: absolute;

  z-index: 8;

  bottom: 168px;

  left: 50%;

  width: 10px;

  height: 40px;

  transform: translateX(-50%);

  border-radius: 3px;

  background:

    linear-gradient(

      90deg,

      #9b7137,

      #fff0c4,

      #c49a51

    );

  box-shadow: 0 0 5px rgba(255, 240, 200, .2);

}

.flame {

  position: absolute;

  top: -18px;

  left: 50%;

  width: 13px;

  height: 19px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:

    radial-gradient(

      ellipse at 50% 70%,

      #fff6b0 0%,

      #ffd35e 35%,

      #f58b30 75%

    );

  box-shadow: 0 0 18px #ffbd45;

  animation: flame .8s infinite alternate;

}

@keyframes flame {

  from {

    transform: translateX(-50%) scale(1);

  }

  to {

    transform: translateX(-50%) scale(.85, 1.15);

  }

}

/* 生日祝福 */

.birthday-message {

  margin-top: 0;

  opacity: 0;

  transform: translateY(20px);

  transition:

    opacity 1s ease .4s,

    transform 1s ease .4s;

  pointer-events: none;

}

.birthday-message.show {

  opacity: 1;

  transform: translateY(0);

  pointer-events: auto;

}

.birthday-message h2 {

  margin: 0;

  color: #f0c9c3;

  font-size: clamp(25px, 6vw, 36px);

  font-weight: 500;

  letter-spacing: 3px;

  text-shadow: 0 0 18px rgba(232, 181, 170, .25);

}

.birthday-message p {

  margin: 15px 0 0;

  color: var(--gold);

  font-size: 19px;

  letter-spacing: 3px;

}

.heart {

  display: inline-block;

  color: #e94b61;

  animation: heartBeat 1.2s infinite;

}

@keyframes heartBeat {

  0%, 100% {

    transform: scale(1);

  }

  50% {

    transform: scale(1.25);

  }

}

/* 驚喜星光 */

.sparkle {

  position: fixed;

  z-index: 10;

  pointer-events: none;

  color: var(--gold);

  animation: sparkle 1.4s ease-out forwards;

}

@keyframes sparkle {

  0% {

    opacity: 0;

    transform: translate(0, 0) scale(0);

  }

  20% {

    opacity: 1;

    transform: translate(var(--x), var(--y)) scale(1.4);

  }

  100% {

    opacity: 0;

    transform:

      translate(

        calc(var(--x) * 1.8),

        calc(var(--y) * 1.8)

      )

      scale(0);

  }

}

.footer {

  position: absolute;

  bottom: 25px;

  color: rgba(232, 200, 121, .45);

  font-size: 11px;

  letter-spacing: 3px;

}

/* 手機版 */

@media (max-width: 480px) {

  .container {

    padding: 20px 15px;

  }

  .gift-scene {

    transform: scale(.9);

    margin-top: 15px;

  }

  .cake-wrap {

    transform: translate(-50%, -50%) scale(.82);

  }

  .cake-wrap.show {

    transform: translate(-50%, -50%) scale(.82);

  }

  .birthday-message h2 {

    letter-spacing: 2px;

  }

}

@media (prefers-reduced-motion: reduce) {

  *,

  *::before,

  *::after {

    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    transition-duration: .01ms !important;

  }

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<main class="container">

  <div class="top-label">

    A Special Day For You

  </div>

  <h1>Happy Birthday</h1>

  <div class="subtitle">

    給最特別的偷偷

  </div>

  <!-- 禮物盒 -->

  <div class="gift-scene" id="giftScene">

    <div class="gift" id="gift">

      <div class="gift-box">

        <div class="box-ribbon"></div>

        <div class="box-ribbon-horizontal"></div>

      </div>

      <div class="gift-lid">

        <div class="lid-ribbon"></div>

        <div class="bow">

          <div class="bow-knot"></div>

        </div>

      </div>

    </div>

    <!-- 黑金雙層巧克力蛋糕 -->

    <div class="cake-wrap" id="cakeWrap">

      <div class="cake">

        <div class="cake-plate"></div>

        <div class="cake-bottom">

          <div class="cake-bottom-top"></div>

        </div>

        <div class="cake-top-tier">

          <div class="cake-top-cap"></div>

        </div>

        <div class="gold-line"></div>

        <div class="upper-gold-line"></div>

        <div class="cake-number">

          1031

        </div>

        <div class="candle">

          <div class="flame"></div>

        </div>

      </div>

    </div>

  </div>

  <div class="hint" id="hint">

    點擊禮物盒，開啟你的生日驚喜

  </div>

  <!-- 生日祝福 -->

  <div class="birthday-message" id="birthdayMessage">

    <h2>偷偷 生日快樂</h2>

    <p>

      愛你的頭頭

      <span class="heart">♥</span>

    </p>

  </div>

  <div class="footer">

    MADE WITH LOVE

  </div>

</main>

<script>

const gift = document.getElementById("gift");

const giftScene = document.getElementById("giftScene");

const cakeWrap = document.getElementById("cakeWrap");

const birthdayMessage = document.getElementById("birthdayMessage");

const hint = document.getElementById("hint");

const stars = document.getElementById("stars");

let isOpened = false;

// 背景星星

for (let i = 0; i < 65; i++) {

  const star = document.createElement("div");

  star.className = "star";

  star.style.left = Math.random() * 100 + "%";

  star.style.top = Math.random() * 100 + "%";

  star.style.animationDelay = Math.random() * 3 + "s";

  star.style.animationDuration = 2 + Math.random() * 3 + "s";

  stars.appendChild(star);

}

// 點擊禮物盒

giftScene.addEventListener("click", () => {

  if (isOpened) return;

  isOpened = true;

  // 禮物盒開啟

  gift.classList.add("open");

  // 提示文字立即消失

  hint.style.display = "none";

  // 星光驚喜

  createSparkles();

  // 顯示蛋糕

  setTimeout(() => {

    cakeWrap.classList.add("show");

  }, 500);

  // 顯示生日祝福

  setTimeout(() => {

    birthdayMessage.classList.add("show");

  }, 1000);

});

// 星光動畫

function createSparkles() {

  const sparkleSymbols = ["✦", "✧", "✨", "★", "♡"];

  const centerX = window.innerWidth / 2;

  const centerY = window.innerHeight / 2;

  for (let i = 0; i < 45; i++) {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.textContent =

      sparkleSymbols[

        Math.floor(Math.random() * sparkleSymbols.length)

      ];

    sparkle.style.left = centerX + "px";

    sparkle.style.top = centerY + "px";

    sparkle.style.setProperty(

      "--x",

      (Math.random() - .5) * 350 + "px"

    );

    sparkle.style.setProperty(

      "--y",

      (Math.random() - .5) * 350 + "px"

    );

    sparkle.style.fontSize =

      10 + Math.random() * 18 + "px";

    sparkle.style.animationDelay =

      Math.random() * .4 + "s";

    document.body.appendChild(sparkle);

    setTimeout(() => {

      sparkle.remove();

    }, 1800);

  }

}

</script>

</body>

</html>
